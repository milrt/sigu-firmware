# Release is the default. Pass the release keys from outside the repo:
#   -DSB_CONFIG_SECURE_BOOT_SIGNING_KEY_FILE=<nsib.pem>
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=<mcuboot.pem>
# Development: -DSB_EXTRA_CONF_FILE=sysbuild_dev.conf -DEXTRA_CONF_FILE=prj_dev.conf

# The layout is in boards/sigu_partitions.dtsi, shared by the app, mcuboot and b0.
SB_CONFIG_PARTITION_MANAGER=n

# NSIB (b0) is immutable and checks MCUboot. Its ed25519 key is in KMU (BL_PUBKEY).
SB_CONFIG_SECURE_BOOT_APPCORE=y
SB_CONFIG_SECURE_BOOT_GENERATE_DEFAULT_KMU_KEYFILE=y

# The version of the MCUboot image in s0/s1. Raise it, and CONFIG_FW_INFO_FIRMWARE_VERSION in
# sysbuild/mcuboot.conf, for every bootloader install.
SB_CONFIG_SECURE_BOOT_MCUBOOT_VERSION="0.0.0+0"

# MCUboot checks the signed TF-M + NS image. Its ed25519 key is in KMU (UROT_PUBKEY).
# Swap-using-move: a new app boots as a test. NS confirms it once it runs (nonsecure/health).
# A reset before that swaps the old app back. There is no downgrade check, any signed app
# installs, but only after OK on the panel (mcuboot_hooks and the install record).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=y
SB_CONFIG_MCUBOOT_GENERATE_DEFAULT_KEY_FILE=y

# sysbuild.cmake fails the build without the two keys, or with a sample, in-repo or shared key.
# app/CMakeLists.txt fails it with prj_dev.conf. sysbuild_dev.conf turns this off.
SB_CONFIG_SIGU_RELEASE=y

# Lock the debug port for both domains. A debugger could read PS or write an old image.
# Only "nrfutil device recover" opens it again, and that erases the chip.
SB_CONFIG_APPROTECT_LOCK=y
SB_CONFIG_SECURE_APPROTECT_LOCK=y
