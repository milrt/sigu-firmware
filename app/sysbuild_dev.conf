# Dev boot settings. Build with
#   -DSB_EXTRA_CONF_FILE=sysbuild_dev.conf -DEXTRA_CONF_FILE=prj_dev.conf
# The debug port stays open, and b0 and MCUboot sign with the NCS debug keys. Never ship it.
SB_CONFIG_SIGU_RELEASE=n

# The NCS default: sysbuild does not touch APPROTECT, so a debugger can attach.
SB_CONFIG_APPROTECT_NO_SYSBUILD=y
SB_CONFIG_SECURE_APPROTECT_NO_SYSBUILD=y
