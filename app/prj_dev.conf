# Dev image. Adds the TFM_BITCOIN_TEST service, the test wallet, the self-tests, the shell on
# the USB console and the TF-M exception dump. Never ship it, a release build refuses it.
# Build with -DEXTRA_CONF_FILE=prj_dev.conf
CONFIG_SIGU_SELFTEST=y

# Shell
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=32000
CONFIG_SHELL_PROMPT_UART="sigu:~$ "

# "fs" in the shell, so the card can be checked from the console.
CONFIG_FILE_SYSTEM_SHELL=y

# Prints the registers on the secure UART when TF-M faults.
CONFIG_TFM_EXCEPTION_INFO_DUMP=y

# "bitcoin test_secure" is one long partition call, and the watchdog feed waits for it. It
# runs close to 60 s on the device, so keep a margin. Too short resets the chip before the summary.
CONFIG_SIGU_WATCHDOG_TIMEOUT_MS=120000
