# System
CONFIG_MAIN_STACK_SIZE=4096

# Logging
CONFIG_LOG=y

# TFM
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_IPC=y
CONFIG_TFM_CONNECTION_BASED_SERVICE_API=y
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y
# The panel config record. It is the nRF54L default, kept here so it is not lost.
CONFIG_TFM_ITS_ENCRYPTED=y
# Zephyr turns the dump on by default. It prints the SP registers on a fault. prj_dev.conf
# turns it back on.
CONFIG_TFM_EXCEPTION_INFO_DUMP=n
#CONFIG_TFM_PARTITION_LOG_LEVEL_DEBUG=y
#CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y

# HUK. TF-M writes a random HUK to KMU on first boot and halts if that fails. PS derives its
# key from it.
CONFIG_HW_UNIQUE_KEY=y
CONFIG_HW_UNIQUE_KEY_RANDOM=y

# P0: 0 and 1 secure UART, 4 OK key. Owned by TFM_SP_BITCOIN.
CONFIG_NRF_GPIO0_PIN_MASK_SECURE=0x00000013
CONFIG_NRF_GPIO0_SECURE=n

# Panel, DEL and NEXT are owned by TFM_SP_BITCOIN too. P1.4 and P1.5 stay NS, they are the
# console UART.
# P1: 7 RESET, 8 CS, 9 DC, 10 NEXT, 11 SCK, 12 MOSI, 13 DEL, 14 backlight
CONFIG_NRF_GPIO1_PIN_MASK_SECURE=0x00007F80
CONFIG_NRF_SPIM22_SECURE=y
CONFIG_NRF_PWM21_SECURE=y
# The 20 ms display tick. psa_wait() has no timeout.
CONFIG_NRF_TIMER22_SECURE=y

# PSA
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_PASSWORD=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# Base64
CONFIG_BASE64=y

# File system. There is no shell here, so USB has no way in. prj_dev.conf adds the shell.
CONFIG_FILE_SYSTEM=y
# No mkfs code: nothing here ever formats the card.
CONFIG_FS_FATFS_MKFS=n

# microSD on SPIM21, FAT32, mounted at /SD: by the sd_job thread in nonsecure/files/src/sdcard.c
CONFIG_DISK_ACCESS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
# Never format the user's card when the mount fails.
CONFIG_FS_FATFS_MOUNT_MKFS=n
# SPIM21 drives the SD card on P2 pins. Pins in another domain need constant latency mode.
CONFIG_NRF_SYS_EVENT=y
CONFIG_SOC_NRF_FORCE_CONSTLAT=y

# Firmware installation from the card. NS writes the image to slot1 and asks MCUboot to install it.
# FW_INFO_API gives the TF-M calls that read the running bootloader's version, and puts no
# fw_info in this image.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FW_INFO=y
CONFIG_FW_INFO_API=y
CONFIG_REBOOT=y
# sd_job reads the swap type every second, and bootutil logs each read at INF.
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y

# WDT31 resets the chip when NS or the partition hangs. nonsecure/health feeds it.
CONFIG_WATCHDOG=y

# No BLE. The wallet is air-gapped, and TFM_SP_BITCOIN makes the RADIO secure at init. TF-M
# has no Kconfig for it. app/CMakeLists.txt refuses CONFIG_BT.

# The app's security counter, signed into the image (TLV SEC_CNT). MCUboot installs no app below
# the highest counter the device has kept (min_security in the install record). Raise it for a
# release that fixes a security bug, or that changes the PS record format: no older app can then
# come back. Never lower it. The panel shows a lower one as blocked.
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--security-counter 1"
