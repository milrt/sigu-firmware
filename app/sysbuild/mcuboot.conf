# Feed WDT31 during the swap, in case it still runs from the app (NS starts it).
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_BOOT_WATCHDOG_FEED_NRFX_WDT=y

# The b0 version counter of this MCUboot. b0 starts the s0/s1 slot with the higher one, and
# refuses a lower one. Raise it, and SB_CONFIG_SECURE_BOOT_MCUBOOT_VERSION in sysbuild.conf, for
# every bootloader install. b0 has 20 counter slots, so the device takes at most 19 of them.
CONFIG_FW_INFO_FIRMWARE_VERSION=1

# MCUboot swaps only what the install record allows (app/mcuboot_hooks). The nRF5340 hook that
# BOOT_IMAGE_ACCESS_HOOKS turns on by default is not for this chip. SHA-256 for the hooks comes
# from mcuboot_hooks/Kconfig: MBEDTLS_PROMPTLESS ignores PSA_WANT_* lines here.
CONFIG_BOOT_GO_HOOKS=y
CONFIG_BOOT_IMAGE_ACCESS_HOOKS=y
CONFIG_BOOT_IMAGE_ACCESS_HOOK_NRF5340=n

# NCS sets LOW for /ns boards. MEDIUM also doubles the FIH variables, so one glitch on a compare
# of the signature result is caught. HIGH needs an mbedtls entropy source, and this MCUboot has
# none.
CONFIG_BOOT_FIH_PROFILE_MEDIUM=y
