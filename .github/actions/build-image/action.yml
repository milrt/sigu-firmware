# Builds the build container (docker/Dockerfile) for the runner's platform, with the GitHub
# Actions layer cache, as sigu-build:ci. Expects the repo checked out at sigu-firmware/.

name: build-image
description: Build the sigu build container with a layer cache

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: sigu-firmware
        file: sigu-firmware/docker/Dockerfile
        load: true
        tags: sigu-build:ci
        cache-from: type=gha,scope=sigu-build-${{ runner.arch }}
        cache-to: type=gha,mode=max,scope=sigu-build-${{ runner.arch }}
